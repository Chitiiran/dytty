appId: com.dytty.dytty
name: "Voice: Discard voice note from transcript review"
tags:
  - voice
  - voice-note
---
- runFlow: "../helpers/login-device.yaml"

- tapOn: "Record voice note"

- extendedWaitUntil:
    visible: ".*Listening.*"
    timeout: 5000

- extendedWaitUntil:
    visible: "Review transcript"
    timeout: 20000

# Assert transcript has content
- extendedWaitUntil:
    visible: ".*grocery.*"
    timeout: 5000

# Tap Discard
- tapOn: "Discard"

# Assert back on home screen — bottom sheet dismissed. The progress
# card merges semantics into one node ("Progress N of 5, ..."), so the
# raw "Today's Progress" text is invisible to Maestro; assert the
# semantics label, which exists regardless of prior entries (the
# "haven't journaled" banner does not).
- extendedWaitUntil:
    visible: 'Progress \d of 5.*'
    timeout: 5000
- assertNotVisible: "Review transcript"

