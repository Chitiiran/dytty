appId: com.dytty.dytty
name: "Voice: Save button disabled until category selected"
tags:
  - voice
  - voice-note
---
- runFlow: "../helpers/login-device.yaml"

- tapOn: "Record voice note"

- extendedWaitUntil:
    visible: ".*Listening.*"
    timeout: 3000

- extendedWaitUntil:
    visible: "Review transcript"
    timeout: 16000

# Save-as-is (#32) guarantees NO category is pre-selected — the old
# Summarize path gambled on the LLM not suggesting one (it usually
# does), which made this flow nondeterministic.
- tapOn: "Save as-is"

- extendedWaitUntil:
    visible: "Review your note"
    timeout: 12000

# Tap Save — disabled with no category, we stay on review screen
- tapOn: "Save"

# Deterministic now: no category can be selected on the save-as-is path
- assertVisible: "Review your note"

# Now select a category
- tapOn: "Positive Things"

# Tap Save again — should work now
- tapOn: "Save"

# Prove we LEFT the review screen: the category chip alone is vacuous
# (it is visible on the review screen we might be stuck on).
- assertNotVisible: "Review your note"
- extendedWaitUntil:
    visible: 'Progress \d of 5.*'
    timeout: 3000
