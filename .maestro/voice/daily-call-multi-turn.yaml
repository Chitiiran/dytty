appId: com.dytty.dytty
name: "Voice: Multi-turn daily call — two exchanges"
tags:
  - voice
  - daily-call
---
# UI-only flow — audio + logcat handled by orchestrate.py
- runFlow: "../helpers/login.yaml"

- tapOn:
    point: "7%,35%"
- extendedWaitUntil:
    visible: "Start voice call"
    timeout: 5000

- tapOn: "Start voice call"
- tapOn: "Start Call"

- extendedWaitUntil:
    visible: "In call.*"
    timeout: 20000

# Orchestrator plays both utterances with Turn complete signals between them.
# Hold the call open long enough for the AI to finish BOTH audio turns —
# a bare `visible: ".*"` matches instantly and ends the call before the AI
# responds, so no AI audio is captured (breaks latency/audio measurement).
- extendedWaitUntil:
    visible: "End call"
    timeout: 45000
- waitForAnimationToEnd:
    timeout: 30000

- tapOn: "End call"

- extendedWaitUntil:
    visible: "Call Summary"
    timeout: 10000
