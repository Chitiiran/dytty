appId: com.dytty.dytty
name: "Voice: Multi-turn daily call — two exchanges"
tags:
  - voice
  - daily-call
---
# UI-only flow — audio + logcat handled by orchestrate.py
- runFlow: "../helpers/login-device.yaml"

# #231: guarded daily-call open (re-foregrounds Dytty before the blind tap).
- runFlow: "../helpers/open-daily-call.yaml"

- tapOn: "Start Call"

- extendedWaitUntil:
    visible: "In call.*"
    timeout: 20000

# Orchestrator plays both utterances with Turn complete signals between them.
# Hold the call open through BOTH turns (utterance -> AI -> utterance -> AI ->
# saves). `waitForAnimationToEnd` returns instantly on the static call screen
# (ends the call early), so force a real ~30s dwell with a repeat loop. (#231)
- extendedWaitUntil:
    visible: "End call"
    timeout: 20000
- repeat:
    times: 30
    commands:
      - extendedWaitUntil:
          visible: "NEVER_APPEARS_DWELL_SENTINEL"
          timeout: 1000
          optional: true

- tapOn: "End call"

# Post-call: reconcile fires on EndCall; hold for its logcat to land.
- extendedWaitUntil:
    visible: "Call Summary"
    timeout: 15000
- repeat:
    times: 8
    commands:
      - extendedWaitUntil:
          visible: "NEVER_APPEARS_DWELL_SENTINEL"
          timeout: 1000
          optional: true
