appId: com.dytty.dytty
name: "Voice: call from a past date saves to that date, not today (#252)"
tags:
  - voice
  - daily-call
  - regression
---
# UI-only flow — audio + logcat handled by orchestrate.py. Regression for
# #252: entries spoken in a call launched from a past date landed on today.
#
# Rig-tuning caveat: this assumes JournalBloc's selectedDate survives the
# `back` to home (the screen captures it at call-bloc construction). If it
# resets on back, start the call from the journal day screen's own call
# affordance instead — screenshot early rather than guessing (owner rule).
#
# Rig-tuning TODO (review finding): add a positive assertVisible on
# yesterday's list keyed to the orchestrator utterance script — the AI's
# saved entry text is nondeterministic, so it can't be asserted here yet.
# Until then the negative assertions below carry the #252 signal (a
# save-to-today regression breaks "Progress 0 of 5").
- runFlow: "../helpers/login-device.yaml"

- assertVisible: "Progress 0 of 5"

# Launch from YESTERDAY's radial mic (#251): the mic FAB now explicitly
# resets to today (_startTodayCall passes today as the route argument), so
# the old browse-back-and-FAB launch would invert this regression's signal.
# The radial mic preserves the tapped date (pinned by widget test, PR #266).
# Rig caveat: on the 1st of a month yesterday's cell sits on the previous
# calendar page (outside days hidden) — skip/expect-fail on that day.
- evalScript: ${output.yday = String(new Date(Date.now() - 86400000).getDate())}
- tapOn: ".*[^0-9]${output.yday}, .*"
- extendedWaitUntil:
    visible: "Start voice call"
    timeout: 5000
- tapOn: "Start voice call"
# (#251) no Start Call tap — the call screen auto-connects on entry
- extendedWaitUntil:
    visible: "In call.*"
    timeout: 20000
- extendedWaitUntil:
    visible: "End call"
    timeout: 20000
- repeat:
    times: 20
    commands:
      - extendedWaitUntil:
          visible: "NEVER_APPEARS_DWELL_SENTINEL"
          timeout: 1000
          optional: true

- tapOn: "End call"
- extendedWaitUntil:
    visible: "Call Summary"
    timeout: 15000
- tapOn: "Done"
- waitForAnimationToEnd:
    timeout: 5000

# The progress card followed yesterday's radial selection and PERSISTS
# (#256 date-aware card) — reset it first so the 0-of-5 assertion reads
# TODAY's card. This also restores the #252 signal: a save-to-today
# regression now shows 1/5 here and fails loudly.
- tapOn: "Go to today"
- assertVisible: "Progress 0 of 5.*"
- assertVisible: "You haven.*journaled today.*"

# The entry must be on yesterday's journal list: browse via yesterday's
# radial bubble (#256 navigation).
- tapOn: ".*[^0-9]${output.yday}, .*"
- extendedWaitUntil:
    visible: "Start voice call"
    timeout: 5000
- tapOn: "Open Positive Things for this day"
- extendedWaitUntil:
    visible: "Positive Things category"
    timeout: 5000
- takeScreenshot: ".maestro/screenshots/latest/voice/252-past-date-call"
