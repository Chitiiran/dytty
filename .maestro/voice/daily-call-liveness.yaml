appId: com.dytty.dytty
name: "Voice: Daily call liveness — AI responds to greeting"
tags:
  - voice
  - daily-call
---
# UI-only flow — audio + logcat handled by orchestrate.py
- runFlow: "../helpers/login-device.yaml"

# #231: guarded daily-call open (re-foregrounds Dytty before the blind tap).
- runFlow: "../helpers/open-daily-call.yaml"

# Navigate to voice call screen

# Start the call
- tapOn: "Start Call"

# Wait for call to connect
# Orchestrator watches for "[DYTTY] Call state: active" and plays audio
- extendedWaitUntil:
    visible: "In call.*"
    timeout: 20000

# Hold the call open for the AI's full audio response. A bare `visible: ".*"`
# matches instantly and ends the call before the AI emits audio (no audio /
# latency captured). waitForAnimationToEnd lets the response land first.
- extendedWaitUntil:
    visible: "End call"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 15000

# End call
- tapOn: "End call"

# Wait for post-call screen
- extendedWaitUntil:
    visible: "Call Summary"
    timeout: 10000
