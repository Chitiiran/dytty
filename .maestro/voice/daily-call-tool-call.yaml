appId: com.dytty.dytty
name: "Voice: Daily call tool call — save_entry invoked"
tags:
  - voice
  - daily-call
---
# UI-only flow — audio + logcat handled by orchestrate.py
- runFlow: "../helpers/login.yaml"

# #231: open the radial menu via a guarded helper (re-foregrounds Dytty so the
# blind coordinate tap can't land on the launcher / another app).
- runFlow: "../helpers/open-radial-menu.yaml"

- tapOn: "Start voice call"
- tapOn: "Start Call"

- extendedWaitUntil:
    visible: "In call.*"
    timeout: 20000

# Orchestrator plays the utterance; hold the call open long enough for the
# FULL utterance + AI response + in-call save_entry to land before ending.
# `waitForAnimationToEnd` returns almost instantly on the static call screen
# (ends the call ~6s in, before saves), so force a real dwell with a repeat
# loop of short input waits — ~20s total in-call. (#231 device-tuned)
- extendedWaitUntil:
    visible: "End call"
    timeout: 20000
- repeat:
    times: 20
    commands:
      - extendedWaitUntil:
          visible: "NEVER_APPEARS_DWELL_SENTINEL"
          timeout: 1000
          optional: true

- tapOn: "End call"

# Post-call: reconcile fires on EndCall and makes its own Gemini call; hold
# for its logcat to land (Reconciliation complete / Entry saved reconciled-add)
# before the flow exits.
- extendedWaitUntil:
    visible: "Call Summary"
    timeout: 15000
- repeat:
    times: 8
    commands:
      - extendedWaitUntil:
          visible: "NEVER_APPEARS_DWELL_SENTINEL"
          timeout: 1000
          optional: true
