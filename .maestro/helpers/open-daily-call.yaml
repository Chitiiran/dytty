appId: com.dytty.dytty
name: "Reusable: open voice call from home (#231)"
---
# Start the daily call from the home-screen mic FAB (#251), which carries
# Semantics(label: 'Start daily call'). CAUTION: the FAB explicitly scopes the
# call to TODAY (SelectDate(today) + today as the route argument) — flows that
# need a past-date call must launch from that date's radial mic instead (see
# voice/daily-call-past-date.yaml).
- extendedWaitUntil:
    visible: "Start daily call"
    timeout: 12000
- tapOn:
    text: "Start daily call"
    retryTapIfNoChange: true
