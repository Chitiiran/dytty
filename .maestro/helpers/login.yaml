appId: com.dytty.dytty
name: "Reusable: login via emulator auth"
---
- launchApp:
    clearState: true

# Cold start done <=> the login button's semantics exist. (waitForAnimation
# hard-fails at timeout on Maestro 2.x, and loading animations loop.)
- extendedWaitUntil:
    visible: "Sign in anonymously.*emulator.*"
    timeout: 20000

- tapOn:
    text: "Sign in anonymously.*emulator.*"
    retryTapIfNoChange: true

# Home ready <=> the progress card's semantics rendered (auth + journal
# state + categories all loaded).
- extendedWaitUntil:
    visible: "Progress .*"
    timeout: 30000
