appId: com.dytty.dytty
name: "Reusable: login via real Google Sign-In (device)"
---
- launchApp:
    clearState: true

# Wait for Flutter cold start (Firebase init + first frame render)
- waitForAnimationToEnd:
    timeout: 15000

# Tap the real Google Sign-In button. Maestro matches the SEMANTICS label
# (login_screen.dart wraps it in Semantics(label: 'Sign in with Google')), NOT
# the visible "Continue with Google" text — Flutter renders text to a canvas,
# so only the semantic label is findable.
- tapOn:
    text: "Sign in with Google"
    retryTapIfNoChange: true

# Wait for the system Google account picker ("Choose an account") to appear.
- extendedWaitUntil:
    visible: "Choose an account"
    timeout: 12000

# Select the test account from the picker (a system overlay — real text nodes).
# DEVICE_TEST_EMAIL must be set in the environment.
- tapOn:
    text: ".*${DEVICE_TEST_EMAIL}.*"
    retryTapIfNoChange: true

# Wait for auth + Firestore load to settle on the home screen.
- waitForAnimationToEnd:
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 10000
