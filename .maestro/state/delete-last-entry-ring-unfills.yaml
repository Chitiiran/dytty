appId: com.dytty.dytty
name: "State: deleting the last entry unfills the ring and restores the nudge"
tags:
  - state
  - regression
---
# Regression test for #162: removing a date's only entry must clear its
# marker — ring empties, progress drops, nudge banner returns.

- runFlow: "../helpers/login.yaml"

- assertVisible: "Progress 0 of 5"

# Add a single entry today
# #256: Write/Today button retired — the progress-card title tap opens
# today's day view (title text sits clear of the category dots).
- tapOn: "Today.s Progress"
- extendedWaitUntil:
    visible: "Positive Things category"
    timeout: 5000
- tapOn: "Add Positive Things entry"
- waitForAnimationToEnd
- tapOn: "What good things happened today.*"
- eraseText
- inputText: "Entry to delete"
- tapOn: "Save"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: ".*Entry to delete.*"

- back
- waitForAnimationToEnd:
    timeout: 5000
# Streak suffix must appear with the first entry (#235): the label renders
# "Progress N of 5, streak K day(s)" only when currentStreak > 0.
- assertVisible: "Progress 1 of 5, streak 1 day.*"

# Delete the entry
# #256: Write/Today button retired — the progress-card title tap opens
# today's day view (title text sits clear of the category dots).
- tapOn: "Today.s Progress"
- extendedWaitUntil:
    visible: "Positive Things category"
    timeout: 5000
- tapOn: "Delete entry"
- waitForAnimationToEnd:
    timeout: 5000

# Back home: ring unfilled, nudge back (#162 checklist: date key
# removed from markers). ".*" suffixes: streak text may follow the
# progress label, and the nudge apostrophe is typographic.
- back
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Progress 0 of 5.*"
- assertVisible: "You haven.*journaled today.*"
# Streak label reverts with the deleted streak-carrying entry (#235):
# suffix renders only when currentStreak > 0, and the delete handler
# refreshes streak from the repository in the background.
- assertNotVisible: ".*streak 1 day.*"

- takeScreenshot: ".maestro/screenshots/latest/state/162-delete-ring-unfills"
