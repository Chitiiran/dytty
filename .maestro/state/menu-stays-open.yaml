appId: com.dytty.dytty
name: "State: radial menu stays open for multi-category entry"
tags:
  - state
  - regression
---
# #158: saving an entry from the radial menu must keep the menu open
# with the checkmark updated, so a second category is one tap away.
# Dismissal is explicit only (backdrop / back).

- runFlow: "../helpers/login.yaml"
- assertVisible: "Progress 0 of 5.*"

# Open the menu on today's cell (mid-grid tap point)
- tapOn:
    point: "50%,40%"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Start voice call"
    timeout: 5000

# Add an entry via the bubble's semantics label (in-house layout)
- tapOn: "Add Positive Things entry from menu"
- waitForAnimationToEnd
- tapOn: "What good things happened today.*"
- inputText: "Stay open entry one"
- tapOn: "Save"
- waitForAnimationToEnd:
    timeout: 5000

# Menu must still be open after the save (#158). Today's progress card
# is intentionally NOT asserted — the mid-grid tap selects an arbitrary
# date and the dashboard is today-sourced (#154). Badge reactivity is
# covered at widget level; the device-level proof of stay-open is that
# a SECOND category is immediately reachable.
- assertVisible: "Start voice call"
- takeScreenshot: ".maestro/screenshots/latest/state/158-menu-still-open"

# Multi-category flow: second bubble opens its sheet directly
- tapOn: "Add Negative Things entry from menu"
- waitForAnimationToEnd
- assertVisible: "What was challenging today.*"
# Dismiss keyboard first — otherwise the next back only closes it
- hideKeyboard
- back
- waitForAnimationToEnd

# Back gesture now dismisses the MENU, not the screen
- back
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible: "Start voice call"
- assertVisible: "Write"
